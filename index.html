<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゲーム部屋</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{--bg:#eceae6;--surface:#fbfaf8;--fg:#1d2233;--muted:#5f6477;--line:#cbc8c1;--mark:#c97700;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#131620;--surface:#1e2231;--fg:#eff0f5;--muted:#a3a8bb;--line:#363b4f;--mark:#ffb13d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.7 "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:calc(env(safe-area-inset-top,0px) + 32px) calc(env(safe-area-inset-bottom,0px) + 32px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:"Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400;margin:0;line-height:1.35}
h1{font-size:2.2rem}
h2{font-size:1.4rem}
p{margin:0}
.lead,.info{color:var(--muted)}
.info{font-size:.82rem;font-weight:700}
.game{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none}
.game:hover{border-color:var(--fg)}
.game:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
.go{font-weight:700;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between}
.art{height:72px;display:flex;align-items:flex-end;gap:10px}
/* 万国旗: 架空の配色の旗 */
.art i{width:56px;height:42px;box-shadow:0 0 0 1px var(--line)}
.art i:nth-child(1){background:linear-gradient(90deg,#1f6f8b 50%,#f2c14e 50%)}
.art i:nth-child(2){background:radial-gradient(circle,#fff 0 11px,#b8405e 12px);align-self:center}
.art i:nth-child(3){background:linear-gradient(#2e4057 33%,#fff 33% 66%,#66a182 66%)}
.art i:nth-child(4){background:linear-gradient(135deg,#5b3f8c 50%,#e8743b 50%);align-self:center}
/* ヘビー13: 3つの台と石 */
.art b{width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:8px solid var(--c)}
.art s{text-decoration:none;display:grid;place-items:center;height:26px;background:var(--fg);color:var(--surface);font:400 .85rem "Dela Gothic One",sans-serif;border-radius:46% 54% 48% 52%/58% 56% 44% 42%}
/* グラデーション: 中央ほど明るい7つの容器 */
.art u{flex:1;max-width:36px;height:52px;text-decoration:none;background:#17191a;border:1.5px solid #6d7677;border-radius:6px 6px 12px 12px}
.art u:nth-child(2),.art u:nth-child(6){background:#4e5456}
.art u:nth-child(3),.art u:nth-child(5){background:#9ea5a7}
.art u:nth-child(4){background:#fff}
</style>
</head>
<body>
<main>
  <header>
    <h1>ゲーム部屋</h1>
    <p class="lead">遊びたいゲームを選んでください。</p>
  </header>

  <a class="game" href="https://ijiabc-maker.github.io/bankokki/">
    <div class="art" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h2>万国旗メモリー</h2>
    <p>10枚の国旗を覚えて、25枚の中から見た5枚を選ぶ記憶ゲーム。</p>
    <p class="info">1人用 ・ 暗記30秒＋回答30秒</p>
    <span class="go"><span>あそぶ</span><span aria-hidden="true">→</span></span>
  </a>

  <a class="game" href="https://ijiabc-maker.github.io/heavy13/">
    <div class="art" aria-hidden="true">
      <b style="--c:#c03a34"><s style="width:34px">2</s><s style="width:52px">5</s></b>
      <b style="--c:#23794a"><s style="width:48px">4</s></b>
      <b style="--c:#2b62b0"><s style="width:30px">1</s><s style="width:44px">3</s></b>
    </div>
    <h2>ヘビー13</h2>
    <p>3つの台に石を積み、合計を13以上にすると罰点を受ける読み合いゲーム。</p>
    <p class="info">あなた＋COMで3〜7人 ・ 全14ラウンド</p>
    <span class="go"><span>あそぶ</span><span aria-hidden="true">→</span></span>
  </a>

  <a class="game" href="https://ijiabc-maker.github.io/gradation/">
    <div class="art" aria-hidden="true"><u></u><u></u><u></u><u></u><u></u><u></u><u></u></div>
    <h2>グラデーション</h2>
    <p>相手の容器の色から数字を推測して、自分の数字をぶつける読み合いゲーム。</p>
    <p class="info">あなた vs COM ・ 全7ラウンド</p>
    <span class="go"><span>あそぶ</span><span aria-hidden="true">→</span></span>
  </a>
</main>
</body>
</html>
